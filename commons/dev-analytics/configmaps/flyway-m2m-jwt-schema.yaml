apiVersion: v1
kind: ConfigMap
metadata:
  name: common-flyway-m2m-jwt-schema
  namespace: dev-analytics
data:
  V1__m2m_jwt_Schema.sql: |-
    CREATE SCHEMA IF NOT EXISTS m2m_jwt;

    GRANT USAGE ON SCHEMA m2m_jwt TO
      ${NAMESPACE}_m2m_jwt_audit_analytics_writer_user;

    GRANT USAGE ON SCHEMA m2m_jwt TO GROUP
      readonly_group;

    GRANT CREATE, ALTER, DROP ON SCHEMA m2m_jwt TO 
      ${NAMESPACE}_m2m_jwt_audit_analytics_writer_user;

    CREATE TABLE IF NOT EXISTS m2m_jwt.generated_token_audit (
      jwt_id VARCHAR(36) PRIMARY KEY,
      correlation_id VARCHAR(36),
      issued_at BIGINT NOT NULL,
      issued_at_tz TIMESTAMPTZ NOT NULL,
      client_id VARCHAR(36) NOT NULL,
      organization_id VARCHAR(36) NOT NULL,
      agreement_id VARCHAR(36) NOT NULL,
      eservice_id VARCHAR(36) NOT NULL,
      descriptor_id VARCHAR(36) NOT NULL,
      purpose_id VARCHAR(36) NOT NULL,
      purpose_version_id VARCHAR(36) NOT NULL,
      algorithm VARCHAR(50) NOT NULL,
      key_id VARCHAR(255) NOT NULL,
      audience VARCHAR(255) NOT NULL,
      subject VARCHAR(255) NOT NULL,
      not_before BIGINT NOT NULL,
      not_before_tz TIMESTAMPTZ NOT NULL,
      expiration_time BIGINT NOT NULL,
      expiration_time_tz TIMESTAMPTZ NOT NULL,
      origin_file_reference VARCHAR(255),
      generated_token_issued_at BIGINT,
      issuer VARCHAR(255) NOT NULL,
      client_assertion_jwt_id VARCHAR(255) NOT NULL,
      typ VARCHAR(50),
      cnf_jkt VARCHAR(255),
      digest_alg VARCHAR(50),
      digest_val VARCHAR(255),
      dpop_jwt_id VARCHAR(255)
    );

    GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE m2m_jwt.generated_token_audit TO
      ${NAMESPACE}_m2m_jwt_audit_analytics_writer_user;

    CREATE TABLE IF NOT EXISTS m2m_jwt.client_assertion_audit (
      jwt_id VARCHAR(255),
      issued_at BIGINT NOT NULL,
      issued_at_tz TIMESTAMPTZ NOT NULL,
      issued_at_raw DOUBLE PRECISION NOT NULL,
      algorithm VARCHAR(50) NOT NULL,
      key_id VARCHAR(255) NOT NULL,
      issuer VARCHAR(255) NOT NULL,
      subject VARCHAR(36) NOT NULL,
      audience VARCHAR(255) NOT NULL,
      expiration_time BIGINT NOT NULL,
      expiration_time_tz TIMESTAMPTZ NOT NULL,
      expiration_time_raw DOUBLE PRECISION NOT NULL,
      origin_file_reference VARCHAR(255),
      generated_token_jwt_id VARCHAR(36) PRIMARY KEY,
      generated_token_issued_at BIGINT,
      digest_alg VARCHAR(50),
      digest_val VARCHAR(255),
      CONSTRAINT fk_generated_token FOREIGN KEY (generated_token_jwt_id) REFERENCES m2m_jwt.generated_token_audit(jwt_id)
    );

    GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE m2m_jwt.client_assertion_audit TO
      ${NAMESPACE}_m2m_jwt_audit_analytics_writer_user;

    CREATE TABLE IF NOT EXISTS m2m_jwt.dpop_audit (
      typ VARCHAR(50) NOT NULL,
      alg VARCHAR(50) NOT NULL,
      jwk_kty VARCHAR(10) NOT NULL,
      jwk_n VARCHAR(2048),
      jwk_e VARCHAR(64),
      jwk_crv VARCHAR(10),
      jwk_x VARCHAR(512),
      jwk_y VARCHAR(512),
      htm VARCHAR(16) NOT NULL,
      htu VARCHAR(1024) NOT NULL,
      iat DOUBLE PRECISION NOT NULL,
      jti VARCHAR(255) NOT NULL,
      generated_token_jwt_id VARCHAR(36) PRIMARY KEY,
      origin_file_reference VARCHAR(255),
      generated_token_issued_at BIGINT NOT NULL,
      generated_token_issued_at_tz TIMESTAMPTZ NOT NULL,
      CONSTRAINT fk_generated_token FOREIGN KEY (generated_token_jwt_id)
        REFERENCES m2m_jwt.generated_token_audit(jwt_id)
    );

    GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE m2m_jwt.dpop_audit TO
      ${NAMESPACE}_m2m_jwt_audit_analytics_writer_user;
